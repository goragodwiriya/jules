<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Shop POS</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="bg-dark text-white shadow-sm">
        <div class="container-fluid py-3">
            <h1 class="h3 mb-0"><i class="bi bi-cup-hot-fill me-2"></i> Coffee Shop POS</h1>
        </div>
    </header>

    <main class="container-fluid mt-4">
        <div class="row g-4">

            <!-- Menu Column -->
            <section class="col-lg-5">
                <div class="card h-100">
                    <div class="card-header">
                        <h5 class="mb-0">เมนู (Menu)</h5>
                    </div>
                    <div class="card-body">
                        <div id="product-list" class="row row-cols-2 row-cols-md-3 g-3">
                            <!-- Products will be dynamically inserted here -->
                            <div class="col"><div class="text-center p-4 border rounded">Loading...</div></div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Cart Column -->
            <section class="col-lg-4">
                <div class="card h-100">
                    <div class="card-header">
                        <h5 class="mb-0">ตะกร้าสินค้า (Cart)</h5>
                    </div>
                    <div class="card-body d-flex flex-column">
                        <div id="cart-items" class="flex-grow-1">
                            <p class="text-center text-muted mt-4">ยังไม่มีสินค้าในตะกร้า</p>
                        </div>
                        <hr>
                        <div class="cart-summary">
                            <h5>ยอดรวม: <span id="cart-total" class="float-end">฿0.00</span></h5>
                        </div>
                    </div>
                    <div class="card-footer p-3">
                        <div class="d-grid gap-2">
                            <button id="payment-cash" class="btn btn-success btn-lg" disabled>ชำระเงินสด</button>
                            <button id="payment-qr" class="btn btn-info btn-lg" disabled>สร้าง QR Code</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Orders Column -->
            <aside class="col-lg-3">
                <div class="card h-100">
                    <div class="card-header">
                        <h5 class="mb-0">รายการสั่งซื้อล่าสุด (Live Orders)</h5>
                    </div>
                    <div class="card-body">
                        <div id="order-feed" class="list-group">
                           <!-- Live orders will be dynamically inserted here -->
                           <p class="text-center text-muted mt-4">กำลังรอออเดอร์...</p>
                        </div>
                    </div>
                </div>
            </aside>

        </div>
    </main>

    <!-- QR Code Modal -->
    <div class="modal fade" id="qr-code-modal" tabindex="-1" aria-labelledby="qrCodeModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="qrCodeModalLabel">Scan for Payment</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body text-center">
            <img id="qr-code-image" src="" alt="QR Code" class="img-fluid">
            <p class="mt-3">Total: <strong id="qr-total"></strong></p>
          </div>
        </div>
      </div>
    </div>


    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/app.js"></script>
</body>
</html>
